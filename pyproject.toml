[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "messytables"
version = "0.15.2"
description = "Parse messy tabular data in various formats"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Open Knowledge Foundation", email = "info@okfn.org" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "chardet>=5.2.0,<6",
    "html5lib>=1.1",
    "json-table-schema==0.2.1",
    "lxml>=5.3.0",
    "python-dateutil>=2.8.2",
    "python-magic>=0.4.27",
    "requests>=2.32.0",
    "xlrd>=1.2.0,<2",
]

[project.optional-dependencies]
test = [
    "httpretty>=1.1.4",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
]
dev = ["ruff>=0.11.0"]

[project.urls]
Documentation = "https://messytables.readthedocs.io"
Homepage = "https://okfn.org"
Repository = "https://github.com/StevenMaude/messytables"

[tool.setuptools.packages.find]
exclude = ["ez_setup", "examples", "test"]

[tool.pytest.ini_options]
markers = ["slow: tests that take longer to execute"]
testpaths = ["test"]

[tool.ruff]
target-version = "py310"
exclude = ["doc"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
